        - spacy ${{ spacy_minor }}.*
        - spacy-curated-transformers >=0.2.2,<1.0.0
        - spacy-pkuseg >=1.0.0,<2.0.0
    tests:
      - python:
          imports:
            - zh_core_web_trf
          python_version: ${{ python_min }}.*
      - requirements:
          run:
            - python ${{ python_min }}.*
        script:
          - python -c "__import__('zh_core_web_trf').load()"
          - python -c "__import__('spacy').load('zh_core_web_trf')"
    about:
      summary: Chinese transformer pipeline (Transformer(name='bert-base-chinese', piece_encoder='bert-wordpiece', stride=152, type='bert', width=768, window=208, vocab_size=21128)).
      description: |-
        Components: transformer, tagger, parser, ner, attribute_ruler.
      license: MIT
      license_file:
        - zh_core_web_trf/LICENSE
        - zh_core_web_trf/LICENSES_SOURCES

