      script:
        - cd ca_core_news_lg
        - ${PYTHON} ${RECIPE_DIR}/patch_meta.py
        - ${PYTHON} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check
    requirements:
      host:
        - pip
        - python ${{ python_min }}.*
        - setuptools
      run:
        - python >=${{ python_min }}
        - spacy ${{ spacy_minor }}.*
    tests:
      - python:
          imports:
            - ca_core_news_lg
          python_version: ${{ python_min }}.*
      - requirements:
          run:
            - python ${{ python_min }}.*
        script:
          - python -c "__import__('ca_core_news_lg').load()"
          - python -c "__import__('spacy').load('ca_core_news_lg')"
    about:
      summary: Catalan pipeline optimized for CPU.
